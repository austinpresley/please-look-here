<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>About window mockup · Look Here Please</title>
<!-- Proposal mockup of the Settings > About page / About panel. SwiftUI: icon 96 pt,
     name .title2 .rounded .heavy with "Here" in brand coral, tagline .secondary. -->
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;gap:32px;grid-auto-flow:column;
  background:#d9d4cd;font-family:system-ui,-apple-system,sans-serif;padding:40px}
.win{width:340px;border-radius:14px;padding:36px 28px 24px;text-align:center;box-shadow:0 20px 50px rgb(0 0 0 / .25),0 0 0 .5px rgb(0 0 0 / .2)}
.light{background:#f6f3ef;color:#1d1d1f}
.dark{background:#2a2628;color:#f2f2f2}
img{width:112px;height:112px;display:block;margin:0 auto 14px}
h1{font-family:ui-rounded,"SF Pro Rounded",system-ui;font-weight:800;font-size:24px;letter-spacing:-.01em;margin:0}
h1 b{color:#E8452B}
.tag{margin:4px 0 14px;font-size:14px;opacity:.75}
.ver{font-size:12px;opacity:.6;margin:0 0 16px}
.by{font-size:13px;margin:0 0 4px}
.credit{font-size:11.5px;opacity:.6;margin:0 0 18px;line-height:1.5}
.links{display:flex;gap:8px;justify-content:center}
.links span{font-size:12px;padding:4px 10px;border-radius:6px;background:rgb(127 127 127 / .16)}
</style></head><body>
<div class="win light">
  <img src="../mark/mark.svg" alt="">
  <h1>Look <b>Here</b> Please</h1>
  <p class="tag">Point it out.</p>
  <p class="ver">Version 1.2.0 (local review)</p>
  <p class="by">By Austin Presley</p>
  <p class="credit">Based on TinyHand by Kamran Ahmed.<br>MIT license.</p>
  <div class="links"><span>Repository</span><span>Credits</span></div>
</div>

  <p class="ver">Version 1.2.0 (local review)</p>

  <div class="links"><span>Repository</span><span>Credits</span></div>
</div>
</body></html>
