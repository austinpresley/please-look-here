<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Look Here Please original hand icons</title><style>*{box-sizing:border-box}body{margin:0;font-family:var(--font-sans,-apple-system,sans-serif);color:var(--foreground,#211729)}nav{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}button{font:inherit;font-size:14px;color:inherit;background:transparent;padding:10px 14px;border:1px solid var(--border,#D9D4DD);border-radius:10px;cursor:pointer}button[aria-selected=true]{background:var(--primary,#211729);color:var(--primary-foreground,#fff)}button:focus-visible{outline:3px solid var(--ring,#6855D9);outline-offset:3px}img{display:block;width:100%;height:auto;border-radius:16px}.panel[hidden]{display:none}p{font-size:14px;line-height:1.6;color:var(--muted-foreground,#655D70);margin:0 0 18px}</style><body><nav role="tablist" aria-label="Original hand icon appearances"><button role="tab" aria-controls="purple-cream" aria-selected="true" onclick="show('purple-cream')">Purple on cream</button><button role="tab" aria-controls="white-coral" aria-selected="false" onclick="show('white-coral')">Original white</button><button role="tab" aria-controls="purple-coral" aria-selected="false" onclick="show('purple-coral')">Purple on coral</button></nav><p>The actual in-app PNGs, preserved byte-for-byte. Native scale and framing keep the whole hand visible. These sheets include real 32 and 16 pixel renders.</p><section class="panel" role="tabpanel" id="purple-cream"><img src="/Volumes/Project-Vault/PROJECTS/Please Look Here/design/brand-refresh/original-hands-2026-11-17/exports/purple-cream-appearances.png" alt="purple cream icon in Default, Dark, TintedLight, TintedDark, ClearLight and ClearDark appearances"></section><section class="panel" role="tabpanel" id="white-coral" hidden><img src="/Volumes/Project-Vault/PROJECTS/Please Look Here/design/brand-refresh/original-hands-2026-11-17/exports/white-coral-appearances.png" alt="white coral icon in Default, Dark, TintedLight, TintedDark, ClearLight and ClearDark appearances"></section><section class="panel" role="tabpanel" id="purple-coral" hidden><img src="/Volumes/Project-Vault/PROJECTS/Please Look Here/design/brand-refresh/original-hands-2026-11-17/exports/purple-coral-appearances.png" alt="purple coral icon in Default, Dark, TintedLight, TintedDark, ClearLight and ClearDark appearances"></section><script>function show(id){document.querySelectorAll('.panel').forEach(p=>p.hidden=p.id!==id);document.querySelectorAll('[role=tab]').forEach(t=>t.setAttribute('aria-selected',String(t.getAttribute('aria-controls')===id)));}</script></body></html>
