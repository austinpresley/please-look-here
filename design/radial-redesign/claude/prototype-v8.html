<!doctype html>
<html><head><meta charset="utf-8">
<style>
*{box-sizing:border-box}
body{font-family:var(--font-sans);color:var(--foreground);font-size:14px;line-height:1.5}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 8px}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.seg button{font:inherit;font-size:12px;padding:4px 10px;border:0;background:transparent;color:var(--muted-foreground);cursor:pointer}
.seg button.on{background:var(--secondary);color:var(--foreground);font-weight:600}
.hintline{font-size:12px;color:var(--muted-foreground);margin:0 0 10px;min-height:18px}
.stage{position:relative;height:680px;border-radius:var(--radius);overflow:hidden;user-select:none;-webkit-user-select:none;
  background:radial-gradient(1200px 600px at 20% 10%,#5b6cff55,transparent 60%),radial-gradient(900px 500px at 90% 90%,#ff7a5c55,transparent 60%),linear-gradient(135deg,#1d2433,#2b2035)}
.stage.holdopen{cursor:none}
.stage:focus{outline:none}
.slide{position:absolute;left:6%;top:9%;right:6%;bottom:13%;border-radius:10px;background:#f7f5f0;box-shadow:0 20px 50px #0006;padding:26px 30px;color:#2a2a2e;overflow:hidden}
.slide h5{margin:0 0 4px;font-size:22px}
.slide p{margin:0 0 18px;font-size:13px;color:#6b6b70}
.bars{display:flex;align-items:flex-end;gap:16px;height:58%}
.bars div{flex:1;border-radius:6px 6px 0 0;background:#c9cbd6}
.bars div.hi{background:#f0614a}
svg.ink{position:absolute;inset:0;pointer-events:none;width:100%;height:100%}
.demotb{position:absolute;left:50%;top:12px;transform:translateX(-50%);display:flex;gap:4px;padding:5px;border-radius:12px;background:rgba(41,36,45,.86);box-shadow:0 6px 18px rgba(0,0,0,.3);backdrop-filter:blur(16px)}
.demotb img{width:26px;height:26px;padding:2px;border-radius:7px}
.demotb img.cur{background:rgba(255,149,137,.28)}
.demotb.hidden{display:none}
.status{position:absolute;left:12px;bottom:12px;display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:999px;background:#000a;color:#fff;font-size:12px;backdrop-filter:blur(10px)}
.status img{width:24px;height:24px}
.status .dot{width:12px;height:12px;border-radius:50%;border:1px solid #fff8}
.status .sep{opacity:.4}
.status button{font:600 12px var(--font-sans);border:0;border-radius:999px;padding:3px 10px;background:#FF9589;color:#302736;cursor:pointer}
.menu{position:absolute;width:384px;height:384px;margin:-192px 0 0 -192px;pointer-events:none;opacity:0;transform:scale(.98);transition:opacity .12s cubic-bezier(.2,0,0,1),transform .12s cubic-bezier(.2,0,0,1)}
.menu.open{opacity:1;transform:scale(1)}
.menu.closing{opacity:0;transform:scale(1);transition:opacity .08s cubic-bezier(.2,0,0,1)}
.menu.instant,.reduce .menu.closing{transition:none}
.reduce .menu{transform:none!important;transition:opacity .08s linear}
.glass{position:absolute;left:28px;top:28px;width:328px;height:328px;border-radius:50%;backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:0 8px 20px var(--mshadow)}
.menu.opaque .glass,.menu.hc .glass{backdrop-filter:none;-webkit-backdrop-filter:none}
svg.m{position:absolute;inset:0;overflow:visible}
.dark{--mfill:rgba(41,36,45,.80);--mhub:rgba(246,240,232,.06);--mline:rgba(246,240,232,.14);--mtext:#F6F0E8;--msub:#C3B9C8;--mdis:#C3B9C8;--mrim:rgba(246,240,232,.20);--sel:#FF9589;--onsel:#302736;--tint:rgba(255,149,137,.20);--arc:#FF9589;--mshadow:rgba(0,0,0,.28);--halo:#29242D}
.light{--mfill:rgba(248,245,241,.84);--mhub:rgba(255,255,255,.55);--mline:rgba(48,39,54,.12);--mtext:#302736;--msub:#645B68;--mdis:#645B68;--mrim:rgba(48,39,54,.14);--sel:#B6423B;--onsel:#ffffff;--tint:rgba(182,66,59,.13);--arc:#B6423B;--mshadow:rgba(0,0,0,.16);--halo:#ffffff}
.menu.opaque.dark,.menu.hc.dark{--mfill:#29242D;--mhub:#332D38}
.menu.opaque.light,.menu.hc.light{--mfill:#F8F5F1;--mhub:#FFFFFF}
.menu.hc.dark{--mline:rgba(246,240,232,.5);--mrim:#F6F0E8;--msub:#E9E2EC}
.menu.hc.light{--mline:rgba(48,39,54,.5);--mrim:#302736;--msub:#3d3442}
.hl{opacity:0;transition:opacity .06s linear}
.hl.on{opacity:1}
.reduce .hl,.reduce .lb,.reduce .ic,.reduce .hub{transition:none!important}
.lb{fill:var(--mtext);font:500 13px var(--font-sans);text-anchor:middle;transition:fill .06s linear}
.child .lb{font-size:12px}
.it.dis .lb{fill:var(--mdis)}
.ic{color:var(--mtext);transition:color .06s linear}
.it.dis .ic{color:var(--mdis)}
.it.on .lb{fill:var(--onsel)}
.it.on .ic{color:var(--onsel)}
.notch{fill:var(--msub);opacity:.55;transition:opacity .06s}
.it.on .notch{fill:var(--onsel);opacity:1}
.it.tint .notch{fill:var(--arc);opacity:1}
.items{transition:opacity .1s cubic-bezier(.2,0,0,1)}
.items.enter{opacity:0;transition:none}
.reduce .items{transition:none}
.hub{transition:opacity .08s cubic-bezier(.2,0,0,1)}
.hubt{fill:var(--mtext);font:600 13px var(--font-sans);text-anchor:middle}
.hubs{fill:var(--msub);font:400 11px var(--font-sans);text-anchor:middle}
.marker{position:absolute;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;border:1.5px solid #fff;box-shadow:0 0 0 1px #000,inset 0 0 0 1px #000;pointer-events:none;display:none;z-index:5}
.holdopen .marker{display:block}
.armline{position:absolute;inset:0;pointer-events:none;width:100%;height:100%;z-index:4}
.toast{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:8px;min-width:120px;padding:8px 10px 8px 16px;border-radius:999px;background:rgba(41,36,45,.92);color:#F6F0E8;font:600 13px var(--font-sans);opacity:0;transition:opacity .2s;pointer-events:none;backdrop-filter:blur(12px);white-space:nowrap;line-height:1.3;z-index:6}
.toast .tx{display:flex;flex-direction:column;padding-right:6px}
.toast small{font:400 11px var(--font-sans);color:#C3B9C8}
.toast.show{opacity:1}
.toast.act{pointer-events:auto}
.toast button{font:600 12px var(--font-sans);height:28px;padding:0 12px;border-radius:999px;border:0;background:#FF9589;color:#302736;cursor:pointer}
.toast button.x{background:transparent;color:#C3B9C8;width:28px;padding:0;font-size:15px}
.reduce .toast{transition:none}
.snack{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:6px 6px 6px 16px;border-radius:999px;background:rgba(41,36,45,.94);color:#F6F0E8;font:600 13px var(--font-sans);box-shadow:0 8px 24px rgba(0,0,0,.35);z-index:6}
.snack[hidden]{display:none}
.snack button{font:600 12px var(--font-sans);height:28px;padding:0 12px;border-radius:999px;border:0;background:#FF9589;color:#302736;cursor:pointer}
.snack button.x{background:transparent;color:#C3B9C8;width:28px;padding:0;font-size:15px}
.snack button:focus-visible{outline:2px solid #0a84ff;outline-offset:2px}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:8}
.flash.go{animation:flash .22s ease-out}
@keyframes flash{0%{opacity:0}25%{opacity:.7}100%{opacity:0}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.listmenu{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(300px,calc(100% - 24px));max-height:calc(100% - 24px);overflow:auto;border-radius:12px;padding:6px;display:none;z-index:6;box-shadow:0 0 0 .5px rgba(0,0,0,.35),0 16px 40px rgba(0,0,0,.4);font:13px/16px var(--font-sans)}
.listmenu.open{display:block}
.listmenu.dark{background:#29242D;color:#F6F0E8;--lsub:#C3B9C8;--lsel:#FF9589;--lon:#302736}
.listmenu.light{background:#F8F5F1;color:#302736;--lsub:#645B68;--lsel:#B6423B;--lon:#fff}
.listmenu .lh{display:flex;align-items:center;gap:6px;padding:4px 6px 8px;font-weight:600;border-bottom:1px solid rgba(127,127,127,.25);margin-bottom:4px}
.listmenu .lh button{font:inherit;font-weight:500;border:0;background:transparent;color:inherit;padding:4px 6px;border-radius:6px;cursor:pointer}
.listmenu .row{width:100%;border:0;background:transparent;color:inherit;font:inherit;text-align:left;display:flex;align-items:center;gap:10px;padding:0 8px;height:28px;border-radius:6px;cursor:default}
.listmenu .row .t{flex:1}
.listmenu .row .s{color:var(--lsub);font-size:12px}
.listmenu .row.f{background:var(--lsel);color:var(--lon)}
.listmenu .row.f .s,.listmenu .row.f .ic{color:var(--lon)}
.listmenu .row.dis{color:var(--lsub)}
.listmenu .row.insp{box-shadow:inset 0 0 0 1px var(--lsub)}
.listmenu .row:focus-visible{outline:2px solid #0a84ff;outline-offset:-2px}
.listmenu:focus{outline:none}
.panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:12px;display:none;flex-direction:column;overflow:hidden;z-index:7;cursor:default;box-shadow:0 0 0 .5px rgba(0,0,0,.4),0 24px 60px rgba(0,0,0,.45);font:13px var(--font-sans)}
.panel.open{display:flex}
.panel.dark{--bbg:#29242D;--btext:#F6F0E8;--bsub:#C3B9C8;--bcell:rgba(246,240,232,.07);--bline:rgba(246,240,232,.14);--bsel:#FF9589}
.panel.light{--bbg:#F8F5F1;--btext:#302736;--bsub:#645B68;--bcell:rgba(48,39,54,.06);--bline:rgba(48,39,54,.14);--bsel:#B6423B}
.panel{background:var(--bbg);color:var(--btext)}
.ptitle{height:44px;display:flex;align-items:center;padding:0 8px 0 16px;border-bottom:1px solid var(--bline);font-weight:600}
.ptitle span{flex:1}
.btn{white-space:nowrap;flex:none;font:500 12px var(--font-sans);height:28px;padding:0 12px;border-radius:7px;border:1px solid var(--bline);background:var(--bcell);color:var(--btext);cursor:pointer}
.btn:disabled{color:var(--bsub);cursor:default;opacity:.8}
.btn:focus-visible,.bseg button:focus-visible,.bgrid:focus-visible,.btools input:focus-visible,.slotrow .btn:focus-visible{outline:2px solid #0a84ff;outline-offset:2px}
.browser{width:min(560px,calc(100% - 24px));height:min(600px,calc(100% - 24px))}
.browser .ptitle,.browser .bfoot{flex:none}
.bbody{flex:1;min-height:0;display:flex;flex-direction:column}
.browser.short .bbody{overflow-y:auto;display:block}
.browser.short .bgrid{overflow:visible;flex:none}
.browser.short .slots{max-height:none;overflow:visible}
.btools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 16px}
.btools input{min-width:140px}
.btools input{flex:1;font:13px var(--font-sans);height:28px;padding:0 10px;border-radius:7px;border:1px solid var(--bline);background:var(--bcell);color:var(--btext);outline:none}
.bseg{display:inline-flex;border-radius:7px;background:var(--bcell);padding:2px}
.bseg button{font:500 12px var(--font-sans);height:24px;padding:0 10px;border-radius:5px;border:0;background:transparent;color:var(--btext);cursor:pointer}
.bseg button[aria-pressed=true]{background:var(--bbg);box-shadow:0 0 0 .5px var(--bline),0 1px 2px rgba(0,0,0,.15);font-weight:600}
.bgrid{flex:1;min-height:0;overflow:auto;padding:4px 16px 12px;width:100%;max-width:528px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,64px);justify-content:center;gap:8px;align-content:start;outline:none}
.bcell{height:72px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:6px;gap:2px;position:relative;cursor:pointer;font:400 11px/14px var(--font-sans);color:var(--bsub);text-align:center}
.bcell img{width:36px;height:36px;flex:none}
.bcell span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:62px}
.bcell.hov{background:var(--bcell)}
.bgrid.editing .bcell.kf{box-shadow:inset 0 0 0 2px var(--bsel);background:var(--bcell);color:var(--btext)}
.bgrid:focus-visible .bcell.kf,.bcell.kf.kbshow{box-shadow:inset 0 0 0 2px #0a84ff;color:var(--btext)}
.bcell .chk{position:absolute;top:3px;right:5px;width:15px;height:15px;border-radius:50%;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.25);display:grid;place-items:center}
.bfoot{flex-wrap:nowrap;display:flex;align-items:center;gap:10px;padding:8px 16px;border-top:1px solid var(--bline);font:12px var(--font-sans);color:var(--bsub);min-height:44px}
.browser.narrow #bcount{display:none}
.bfoot b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;color:var(--btext);font-weight:600;font-size:13px}
.bfoot .sp{flex:1}
.bempty{grid-column:1/-1;text-align:center;color:var(--bsub);padding:40px 0}
.slots{display:none;flex-direction:column;border-top:1px solid var(--bline);padding:8px 16px}
.slots.open{display:flex}
.slots .sh{display:flex;align-items:center;font-weight:600;padding:2px 0 6px}
.slots .sh span{flex:1}
.slotrow{display:flex;align-items:center;gap:10px;min-height:34px}
.slots{max-height:45%;overflow:auto;flex:none}
.slotrow:focus-visible{outline:2px solid #0a84ff;outline-offset:2px;border-radius:6px}
.slotrow .dir{width:28px;color:var(--bsub);font-size:11px}
.slotrow img{width:26px;height:26px}
.slotrow .nm{flex:1;min-width:0;overflow-wrap:anywhere;line-height:15px;padding:4px 0}
.slotrow img,.slotrow .dir{flex:none}
.settings{width:min(380px,calc(100% - 24px))}
.srow{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--bline)}
.srow:last-child{border-bottom:0}
.srow span:last-child{color:var(--bsub)}
</style></head>
<body>
<div class="bar">
  <div class="seg" id="modeSeg"><button data-v="click" class="on">Click mode</button><button data-v="hold">Hold mode</button></div>
  <div class="seg" id="themeSeg"><button data-v="dark" class="on">Dark</button><button data-v="light">Light</button></div>
  <div class="seg" id="motionSeg"><button data-v="full" class="on">Motion</button><button data-v="reduce">Reduce Motion</button></div>
  <div class="seg" id="contrastSeg"><button data-v="glass" class="on">Glass</button><button data-v="opaque">Reduce Transparency</button><button data-v="hc">Increase Contrast</button></div>
  <div class="seg" id="sizeSeg"><button data-v="normal" class="on">Full display</button><button data-v="small">Small display</button></div>
</div>
<div class="hintline" id="hint"></div>
<div class="stage" id="stage" tabindex="-1" aria-label="Presentation">
  <div class="slide"><h5>Q4 launch review</h5><p>Point it out. Draw it on screen.</p>
    <div class="bars"><div style="height:40%"></div><div style="height:62%"></div><div class="hi" style="height:88%"></div><div style="height:55%"></div><div style="height:70%"></div></div></div>
  <svg class="ink" id="ink"></svg>
  <div class="demotb" id="demotb" aria-label="Toolbar"></div>
  <svg class="armline" id="armline"></svg>
  <div class="status" id="status"></div>
  <div class="menu dark" id="menu"><div class="glass"></div>
    <svg class="m" id="svg" viewBox="-192 -192 384 384"><g id="gBase"></g><g id="gHi"></g><g id="gItems" class="items"></g><g id="gFocus"></g><g id="hubA" class="hub"></g><g id="hubB" class="hub" style="opacity:0"></g></svg></div>
  <div class="toast" id="toast" role="status"></div>
  <div class="snack" id="snack" role="region" aria-label="Undo clear" hidden></div>
  <div class="marker" id="marker"></div>
  <div class="flash" id="flash"></div>
  <div class="listmenu dark" id="listmenu" tabindex="-1"></div>
  <div class="panel browser dark" id="browser" role="dialog" aria-modal="true" aria-label="Pointers">
    <div class="ptitle"><span>Pointers</span><button class="btn" id="bclose">Close</button></div>
    <div class="bbody" id="bbody"><div class="btools"><input id="bsearch" placeholder="Search pointers" aria-label="Search pointers" spellcheck="false"><div class="bseg" role="group" aria-label="Show"><button data-v="all" aria-pressed="true">All</button><button data-v="fav" aria-pressed="false">Quick controls</button></div></div>
    <div class="bgrid" id="bgrid" role="listbox" aria-label="Pointers" tabindex="0"></div>
    <div class="slots" id="slots" role="group" aria-label="Quick controls favorites"></div></div>
    <div class="bfoot"><b id="bname"></b><span id="bcount"></span><span class="sp"></span><button class="btn" id="bedit">Edit Quick controls…</button></div>
  </div>
  <div class="panel settings dark" id="settings" role="dialog" aria-label="Settings">
    <div class="ptitle"><span>Settings · Quick controls</span><button class="btn" id="sclose">Close</button></div>
    <div class="srow"><span>Hold to open</span><span>Control</span></div>
    <div class="srow"><span>Open Quick controls</span><span>⌃⌥Space</span></div>
    <div class="srow"><span>Favorites</span><span>6 pointers · edit in Pointers</span></div>
  </div>
  <div class="sr" id="qc" role="menu" aria-label="Quick controls"></div>
  <div class="sr" id="live" aria-live="polite"></div>
</div>

let lastSize='';new ResizeObserver(()=>{const r=stageRect(),s=Math.round(r.width)+'x'+Math.round(r.height);if(lastSize&&s!==lastSize&&sess)close();lastSize=s}).observe(stage);
document.addEventListener('keydown',e=>{
 if(panelOpen){panelKey(e);return}
 const k=e.key,mod=e.metaKey||e.ctrlKey;
 if(pending){cancelPending();if(k==='Escape')e.preventDefault();say('Canceled');return}
 if(!sess){if(mod&&!e.altKey&&k.toLowerCase()==='z'){e.preventDefault();const ok=e.shiftKey?redo():undo();if(ok)showToast(e.shiftKey?'Redone':'Undone','Last change')}return}
 if(e.altKey||e.ctrlKey||e.metaKey)return; // leave modified chords (including VoiceOver's) alone
 const items=ITEMS(sess.level),hold=mode==='hold';
 if(['Tab','ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Enter',' ','Backspace','1','2','3','4','5','6','7','8'].includes(k))sess.kbOwn=true;
 if(k==='Escape'){e.preventDefault();if(hold||sess.level==='root')close();else{goBack(false);sess.kb=true;update()}return}
 if(k==='Backspace'&&!hold){e.preventDefault();if(sess.level==='root')close();else{goBack(false);sess.kb=true;update()}return}
 const order=sess.list?items.map((it,i)=>i):items.map((it,i)=>i).sort((x,y)=>{const b=sess.level==='root'?0:items[0].angle+1;return norm(items[x].angle-b)-norm(items[y].angle-b)});
 const fwd=(k==='Tab'&&!e.shiftKey)||k==='ArrowRight'||(sess.list&&k==='ArrowDown'),bwd=(k==='Tab'&&e.shiftKey)||k==='ArrowLeft'||(sess.list&&k==='ArrowUp');
 if(fwd||bwd){e.preventDefault();const mv=fwd?1:-1,pos=order.indexOf(sess.focus);const nx=order[(pos<0?(mv>0?0:order.length-1):(pos+mv+order.length)%order.length)];sess.focus=nx;sess.cand=items[nx].dis?-1:nx;sess.kb=true;sess.armed=true;sess.needNeutral=false;update();return}
 if(/^[1-8]$/.test(k)&&sess.level==='root'){const i=+k-1;sess.focus=i;sess.cand=items[i].dis?-1:i;sess.kb=true;update();return}
 if((k==='Enter'||k===' ')&&sess.focus>=0){e.preventDefault();activate(sess.focus,true)}});
// ---- controls ----
function seg(id,cb){$(id).addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;[...$(id).children].forEach(x=>x.classList.toggle('on',x===b));cb(b.dataset.v)})}
function setSeg(id,v){[...$(id).children].forEach(x=>x.classList.toggle('on',x.dataset.v===v))}
const HINT={click:'Click mode, from the “Open Quick controls” shortcut. Hover previews; click a category to open it where you click, then click a choice. Click outside or press Esc to close. Click the slide to reopen. Keys: Tab or arrows, Return, Esc or Delete, 1–8. ⌘Z undoes after the menu closes.',
 hold:'Hold mode, from the held modifier. Press and hold on the slide; the menu opens after 180 ms. Move toward a category to open it where you are, keep moving to a choice, release to apply. Release in the center or press Esc to cancel. Try a corner.'};
function reopen(){close();closePanels();$('hint').textContent=HINT[mode];if(mode==='click'){const sr=stageRect();open({x:sr.width/2,y:sr.height/2})}}
seg('modeSeg',v=>{mode=v;reopen()});
seg('themeSeg',v=>{theme=v;menu.classList.remove('dark','light');menu.classList.add(v);listmenu.classList.remove('dark','light');listmenu.classList.add(v);if(sess&&!sess.list){build();update()}else if(sess)update()});
seg('motionSeg',v=>stage.classList.toggle('reduce',v==='reduce'));
seg('contrastSeg',v=>{menu.classList.remove('opaque','hc');if(v!=='glass')menu.classList.add(v);if(sess&&!sess.list){build();update()}});
seg('sizeSeg',v=>{smallForced=v==='small';reopen()});
// system accommodations set the starting demo state
if(matchMedia('(prefers-reduced-motion: reduce)').matches){stage.classList.add('reduce');setSeg('motionSeg','reduce')}
if(matchMedia('(prefers-contrast: more)').matches){menu.classList.add('hc');setSeg('contrastSeg','hc')}
else if(matchMedia('(prefers-reduced-transparency: reduce)').matches){menu.classList.add('opaque');setSeg('contrastSeg','opaque')}
$('hint').textContent=HINT.click;drawInk();status();
{const sr=stageRect();open({x:sr.width/2,y:sr.height/2},true);if(sess&&!sess.list){const [x,y]=pt(0,118);track({x:sr.width/2+x,y:sr.height/2+y})}}
</script>
</body></html>
