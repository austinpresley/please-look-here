<!doctype html>
<html><head><meta charset="utf-8">
<style>
*{box-sizing:border-box}
body{font-family:var(--font-sans);color:var(--foreground);font-size:14px;line-height:1.5}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 8px}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.seg button{font:inherit;font-size:12px;padding:4px 10px;border:0;background:transparent;color:var(--muted-foreground);cursor:pointer}
.seg button.on{background:var(--secondary);color:var(--foreground);font-weight:600}
.hintline{font-size:12px;color:var(--muted-foreground);margin:0 0 10px;min-height:18px}
.stage{position:relative;height:680px;border-radius:var(--radius);overflow:hidden;user-select:none;-webkit-user-select:none;
  background:radial-gradient(1200px 600px at 20% 10%,#5b6cff55,transparent 60%),radial-gradient(900px 500px at 90% 90%,#ff7a5c55,transparent 60%),linear-gradient(135deg,#1d2433,#2b2035)}
.stage.menuopen{cursor:none}
.slide{position:absolute;left:6%;top:6%;right:6%;bottom:13%;border-radius:10px;background:#f7f5f0;box-shadow:0 20px 50px #0006;padding:26px 30px;color:#2a2a2e;overflow:hidden}
.slide h5{margin:0 0 4px;font-size:22px}
.slide p{margin:0 0 18px;font-size:13px;color:#6b6b70}
.bars{display:flex;align-items:flex-end;gap:16px;height:60%}
.bars div{flex:1;border-radius:6px 6px 0 0;background:#c9cbd6}
.bars div.hi{background:#f0614a}
svg.ink{position:absolute;inset:0;pointer-events:none;width:100%;height:100%}
.status{position:absolute;left:12px;bottom:12px;display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:999px;background:#000a;color:#fff;font-size:12px;backdrop-filter:blur(10px)}
.status img{width:24px;height:24px}
.status .dot{width:12px;height:12px;border-radius:50%;border:1px solid #fff8}
.status .sep{opacity:.4}
.menu{position:absolute;pointer-events:none;opacity:0;transform:translate(-50%,-50%) scale(.98);transition:opacity .12s cubic-bezier(.2,0,0,1),transform .12s cubic-bezier(.2,0,0,1)}
.menu.open{opacity:1;transform:translate(-50%,-50%) scale(1)}
.menu.swap .content{animation:fadein .1s cubic-bezier(.2,0,0,1)}
@keyframes fadein{from{opacity:.25}to{opacity:1}}
.reduce .menu{transition:opacity .08s linear;transform:translate(-50%,-50%)!important}
.reduce .menu.swap .content{animation:none}
.reduce .sec,.reduce .toast{transition:none!important}
.glass{position:absolute;left:50%;top:50%;width:328px;height:328px;border-radius:50%;transform:translate(-50%,-50%);backdrop-filter:blur(24px) saturate(1.5);-webkit-backdrop-filter:blur(24px) saturate(1.5);box-shadow:0 8px 20px var(--mshadow)}
svg.m{position:absolute;inset:0;overflow:visible}
.dark{--mfill:rgba(41,36,45,.80);--mhub:rgba(64,57,70,.86);--mline:rgba(246,240,232,.12);--mtext:#F6F0E8;--msub:#C3B9C8;--mdis:#8f8796;--mrim:rgba(246,240,232,.18);--sel:#FF9589;--onsel:#302736;--tint:rgba(255,149,137,.20);--arc:#FF9589;--mshadow:rgba(0,0,0,.28)}
.light{--mfill:rgba(248,245,241,.84);--mhub:rgba(255,255,255,.92);--mline:rgba(48,39,54,.10);--mtext:#302736;--msub:#645B68;--mdis:#8a818e;--mrim:rgba(48,39,54,.12);--sel:#B6423B;--onsel:#ffffff;--tint:rgba(182,66,59,.13);--arc:#B6423B;--mshadow:rgba(0,0,0,.16)}
.sec{transition:fill .06s}
.lbl{fill:var(--mtext);font:600 13px var(--font-sans);text-anchor:middle}
.lbl.child{font-size:12px}
.lbl.dis{fill:var(--mdis)}
.on .lbl{fill:var(--onsel)}
.ic{color:var(--mtext)}
.on .ic{color:var(--onsel)}
.dis .ic{color:var(--mdis)}
.hubt{fill:var(--mtext);font:650 13px var(--font-sans);text-anchor:middle}
.hubs{fill:var(--msub);font:500 11px var(--font-sans);text-anchor:middle}
.marker{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1.5px #000,inset 0 0 0 1.5px #000;pointer-events:none;display:none;z-index:5}
.menuopen .marker{display:block}
.armline{position:absolute;inset:0;pointer-events:none;width:100%;height:100%;z-index:4}
.toast{position:absolute;transform:translate(-50%,-50%);min-width:112px;padding:9px 16px;border-radius:999px;background:rgba(41,36,45,.9);color:#F6F0E8;font:600 13px var(--font-sans);text-align:center;opacity:0;transition:opacity .2s;pointer-events:none;backdrop-filter:blur(12px);white-space:nowrap;line-height:1.3}
.toast small{display:block;font:500 11px var(--font-sans);color:#C3B9C8}
.toast.show{opacity:1}
.browser{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100% - 24px));height:min(600px,calc(100% - 24px));border-radius:14px;background:var(--bbg);color:var(--btext);box-shadow:0 0 0 .5px rgba(0,0,0,.4),0 24px 60px rgba(0,0,0,.45);display:none;flex-direction:column;overflow:hidden;z-index:6;cursor:default}
.browser.open{display:flex}
.browser.dark{--bbg:#29242D;--btext:#F6F0E8;--bsub:#C3B9C8;--bcell:rgba(246,240,232,.06);--bline:rgba(246,240,232,.12)}
.browser.light{--bbg:#F8F5F1;--btext:#302736;--bsub:#645B68;--bcell:rgba(48,39,54,.05);--bline:rgba(48,39,54,.12)}
.btitle{height:40px;display:flex;align-items:center;gap:8px;padding:0 14px;border-bottom:1px solid var(--bline);font:600 13px var(--font-sans)}
.btitle i{width:12px;height:12px;border-radius:50%;display:inline-block}
.btitle span{flex:1;text-align:center;margin-right:52px}
.btools{display:flex;gap:10px;align-items:center;padding:12px 16px}
.btools input{flex:1;font:13px var(--font-sans);padding:6px 10px;border-radius:7px;border:1px solid var(--bline);background:var(--bcell);color:var(--btext);outline:none}
.btools input:focus{box-shadow:0 0 0 3px rgba(10,132,255,.45)}
.bseg{display:inline-flex;border-radius:7px;background:var(--bcell);padding:2px;font-size:12px}
.bseg span{padding:3px 10px;border-radius:5px;cursor:pointer}
.bseg span.on{background:var(--bbg);box-shadow:0 0 0 .5px var(--bline),0 1px 2px rgba(0,0,0,.15);font-weight:600}
.bgrid{flex:1;overflow:auto;padding:4px 16px 12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px;align-content:start}
.bcell{height:72px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative;cursor:pointer;font:500 11px var(--font-sans);color:var(--bsub);text-align:center;line-height:1.15}
.bcell img{width:36px;height:36px}
.bcell:hover{background:var(--bcell)}
.bcell.f{background:var(--tint2,rgba(182,66,59,.13));box-shadow:inset 0 0 0 2px #B6423B;color:var(--btext)}
.browser.dark .bcell.f{box-shadow:inset 0 0 0 2px #FF9589;background:rgba(255,149,137,.18)}
.bcell .chk{position:absolute;top:4px;right:6px;width:15px;height:15px;border-radius:50%;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.25);display:grid;place-items:center}
.bfoot{display:flex;align-items:center;gap:10px;padding:10px 16px;border-top:1px solid var(--bline);font:12px var(--font-sans);color:var(--bsub)}
.bfoot b{color:var(--btext);font-weight:600;font-size:13px}
.bfoot .sp{flex:1}
.bempty{grid-column:1/-1;text-align:center;color:var(--bsub);padding:40px 0;font-size:13px}
</style></head>
<body>
<div class="bar">
  <div class="seg" id="modeSeg"><button data-v="click" class="on">Click mode</button><button data-v="hold">Hold mode</button></div>
  <div class="seg" id="themeSeg"><button data-v="dark" class="on">Dark</button><button data-v="light">Light</button></div>
  <div class="seg" id="motionSeg"><button data-v="full" class="on">Motion</button><button data-v="reduce">Reduce Motion</button></div>
</div>

  <svg class="ink" id="ink"></svg>

  <div class="marker" id="marker"></div>
  <div class="browser dark" id="browser">
    <div class="btitle"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i><span>Pointers</span></div>
    <div class="btools"><input id="bsearch" placeholder="Search pointers" spellcheck="false"><div class="bseg" id="bseg"><span data-v="all" class="on">All</span><span data-v="fav">Quick controls</span></div></div>
    <div class="bgrid" id="bgrid"></div>
    <div class="bfoot"><b id="bname"></b><span class="sp"></span><span>Return chooses · Esc cancels</span></div>

</div>

const TOOLS=[['pen','Pen'],['highlighter','Highlighter'],['rectangle','Rectangle'],['arrow','Arrow'],['text','Text'],['number','Number'],['eraser','Eraser']];

function arc(r0,r1,a0,a1){const q=(a,r)=>pt(a,r).map(v=>v.toFixed(2)).join(' ');const l=(a1-a0)>180?1:0;
 return `M${q(a0,r1)}A${r1} ${r1} 0 ${l} 1 ${q(a1,r1)}L${q(a1,r0)}A${r0} ${r0} 0 ${l} 0 ${q(a0,r0)}Z`;}

 {id:'undo',kind:'cmd',title:'Undo',angle:270,art:s=>icon('undo',s),dis:!canUndo(),reason:'Nothing to undo',sub:'Last change'},
 {id:'more',kind:'group',title:'More',angle:315,art:s=>icon('more',s),sub:hold?'Move out to open':'Click to open'}];}
function CHOICES(g){
 if(g==='pointer'){const f=FAV;return [f[4],f[5],'ALL',f[0],f[1],f[2],f[3]].map(id=>id==='ALL'?{id:'all',kind:'leaf',title:'All pointers…',lines:['All','pointers…'],art:s=>icon('grid',s-6),sub:'Opens browser'}:
   {id,kind:'leaf',title:byId(id).title,colorful:true,cur:S.pointer===id,art:s=>ptrImg(id,s+4),sub:S.pointer===id?'Current':'',lines:byId(id).title.split(' ').length>1&&byId(id).title.length>9?byId(id).title.split(' '):null});}
 if(g==='color')return INKS.map(([id,t])=>({id,kind:'leaf',title:t,lines:id==='match'?['Match','pointer']:null,colorful:true,cur:S.ink===id,art:s=>inkChip(id,13),hubTitle:id==='match'?'Match pointer':t,sub:S.ink===id?'Current':(id==='match'?'Uses its ink':'')}));
 if(g==='draw')return TOOLS.map(([id,t])=>({id,kind:'leaf',title:t,cur:S.tool===id,art:s=>icon(id,s-2),sub:S.interact?'Starts drawing':(S.tool===id?'Current':'')}));
 if(g==='more')return [
  {id:'redo',kind:'leaf',title:'Redo',art:s=>icon('redo',s-2),dis:!canRedo(),reason:'Nothing to redo',sub:'Last undone change'},
  {id:'sound',kind:'leaf',title:'Tap sound',lines:['Tap','sound'],art:s=>icon('sound',s-2),cur:S.sound,sub:S.sound?'Turn off':'Turn on'},
  {id:'mute',kind:'leaf',title:'Mute all sounds',lines:['Mute all','sounds'],art:s=>icon('mute',s-2),cur:S.mute,hubTitle:'Mute all',sub:S.mute?'Turn off':'Turn on'},
  {id:'toolbar',kind:'leaf',title:'Toolbar',art:s=>icon('toolbar',s-2),cur:S.toolbar,sub:S.toolbar?'Hide':'Show'},
  {id:'settings',kind:'leaf',title:'Settings…',art:s=>icon('gear',s-2),sub:'Opens Settings'},
  {id:'off',kind:'leaf',title:'Pointer off',lines:['Pointer','off'],art:s=>icon('power',s-2),sub:'Hides pointer'}];
 return [];}
function ITEMS(level){if(level==='root')return ROOT();
 const axis=ROOT().find(r=>r.id===level).angle,ch=CHOICES(level),N=ch.length+1,step=360/N,back=norm(axis+180);
 return [{id:'back',kind:'back',title:'Back',angle:back,art:s=>`<g transform="rotate(${back})">${icon('back',s-4)}</g>`,sub:'Quick controls'}].concat(ch.map((c,k)=>({...c,angle:norm(back+(k+1)*step)})));}
const width=level=>360/ITEMS(level).length;
// ---- rendering ----
function render(swap){if(!sess)return;const items=ITEMS(sess.level),w=360/items.length,child=sess.level!=='root',f=sess.focus;
 const size=child?30:28;let h=`<g class="content">`;
 h+=`<circle r="${ROUT}" fill="var(--mfill)"/><circle r="${ROUT-.5}" fill="none" stroke="var(--mrim)"/>`;
 items.forEach((it,i)=>{const a=it.angle,isF=f===i,filled=isF&&!it.dis&&!it.colorful,tinted=isF&&!it.dis&&it.colorful;
  if(filled)h+=`<path class="sec" d="${arc(RIN+2,ROUT-3,a-w/2+1.2,a+w/2-1.2)}" fill="var(--sel)"/>`;
  if(tinted)h+=`<path class="sec" d="${arc(RIN+2,ROUT-3,a-w/2+1.2,a+w/2-1.2)}" fill="var(--tint)"/><path d="${arc(ROUT-6,ROUT-3,a-w/2+1.6,a+w/2-1.6)}" fill="var(--arc)"/>`;
  if(isF&&it.dis)h+=`<path d="${arc(RIN+3,ROUT-4,a-w/2+1.6,a+w/2-1.6)}" fill="none" stroke="var(--mdis)" stroke-dasharray="4 3"/>`;
  if(isF&&sess.kb)h+=`<path d="${arc(RIN+1,ROUT-1,a-w/2+.6,a+w/2-.6)}" fill="none" stroke="#0a84ff" stroke-width="2.5"/>`;
  const [x,y]=pt(a,CONTENT-(child?4:0)),lines=it.lines||[it.title],lh=child?13:14,ty=y+(it.badge?10:14)-(lines.length-1)*lh/2+(lines.length>1?4:0);
  h+=`<g class="${filled?'on':''} ${it.dis?'dis':''}"><g transform="translate(${x} ${y-(lines.length>1?12:9)})">${it.art(size)}</g>`;
  lines.forEach((ln,k)=>{h+=`<text class="lbl ${child?'child':''} ${it.dis?'dis':''}" x="${x}" y="${ty+k*lh+(lines.length>1?2:0)}">${esc(ln)}</text>`});
  if(it.badge){const on=it.badge==='ON';h+=`<g transform="translate(${x} ${y+28})"><rect x="-17" y="-8" width="34" height="16" rx="8" fill="${on?(filled?'var(--onsel)':'var(--sel)'):'none'}" stroke="${on?'none':(filled?'var(--onsel)':'var(--msub)')}"/><text y="4" text-anchor="middle" style="font:700 11px var(--font-sans);fill:${on?(filled?'var(--sel)':'var(--onsel)'):(filled?'var(--onsel)':'var(--msub)')}">${it.badge}</text></g>`}
  if(it.cur){const [bx,by]=[x+17,y-(lines.length>1?12:9)-14];h+=`<g transform="translate(${bx} ${by})"><circle r="7.5" fill="#fff" stroke="rgba(0,0,0,.28)"/><path d="M-3.4 .2l2.3 2.3 4.4-4.6" fill="none" stroke="#B6423B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>`}
  if(it.kind==='group'){const [cx2,cy2]=pt(a,ROUT-11);h+=`<g transform="translate(${cx2} ${cy2}) rotate(${a})"><path d="M-4 2.5L0 -1.5 4 2.5" fill="none" stroke="${filled?'var(--onsel)':'var(--msub)'}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g>`}
  h+=`</g>`;});
 for(let i=0;i<items.length;i++){const a=items[i].angle+w/2,[x0,y0]=pt(a,RIN+8),[x1,y1]=pt(a,ROUT-10);h+=`<line x1="${x0}" y1="${y0}" x2="${x1}" y2="${y1}" stroke="var(--mline)"/>`}
 // hub
 h+=`<circle r="${HUB}" fill="var(--mhub)" stroke="var(--mrim)"/>`;
 const hold=mode==='hold';let top,bot,art=null;
 const groupTitle=child?ROOT().find(r=>r.id===sess.level).title:'Quick controls';
 if(!sess.armed){top='Move to center';bot='to start'}
 else if(sess.needNeutral){top='Quick controls';bot='Move to center'}
 else if(f!=null&&f>=0){const it=items[f];art=it.kind==='back'?null:it;top=it.hubTitle||it.title;bot=it.dis?it.reason:it.sub;}
 else {top=groupTitle;bot=child?(hold?'Move to choose':'Click a choice'):(hold?'Release cancels':'Esc closes')}
 const fit=(s,n)=>s&&s.length>n?s.slice(0,n-1)+'…':s;
 if(art){h+=`<g transform="translate(0 -17)" class="${art.dis?'dis':''}">${art.art(34)}</g><text class="hubt" y="17">${esc(fit(top,14))}</text>${bot?`<text class="hubs" y="32">${esc(fit(bot,17))}</text>`:''}`}
 else{h+=`<text class="hubt" y="-18">${esc(fit(top,14))}</text>${bot?`<text class="hubs" y="27">${esc(fit(bot,17))}</text>`:''}`}
 h+=`</g>`;
 svg.innerHTML=h;
 if(swap){menu.classList.remove('swap');void menu.offsetWidth;menu.classList.add('swap')}
 drawArmLine();}
function placeMenu(){const s=scale;menu.style.left=sess.O.x+'px';menu.style.top=sess.O.y+'px';menu.style.width=384*s+'px';menu.style.height=384*s+'px';
 svg.setAttribute('viewBox','-192 -192 384 384');menu.querySelector('.glass').style.transform=`translate(-50%,-50%) scale(${s})`;}
function drawArmLine(){if(sess&&!sess.armed){armline.innerHTML=`<line x1="${cursor.x}" y1="${cursor.y}" x2="${sess.O.x}" y2="${sess.O.y}" stroke="#fff" stroke-width="2" stroke-dasharray="5 5" opacity=".85"/>`}else armline.innerHTML=''}
// ---- session ----
function clampO(p){const sr=stage.getBoundingClientRect(),m=HALF*scale;return {x:Math.min(Math.max(p.x,m),Math.max(m,sr.width-m)),y:Math.min(Math.max(p.y,m),Math.max(m,sr.height-m))}}
function open(p){closeBrowser(true);const sr=stage.getBoundingClientRect();scale=Math.min(1,(sr.width-16)/384);const O=clampO(p),shift=Math.hypot(O.x-p.x,O.y-p.y);
 sess={level:'root',O,parent:null,armed:shift<=8,needNeutral:false,focus:-1,cand:-1,kb:false};placeMenu();render();
 stage.classList.add('menuopen');requestAnimationFrame(()=>menu.classList.add('open'));}
function close(result,sub){if(!sess)return;const O=sess.O;sess=null;menu.classList.remove('open');stage.classList.remove('menuopen');armline.innerHTML='';
 if(result){toast.innerHTML=esc(result)+(sub?`<small>${esc(sub)}</small>`:'');toast.style.left=O.x+'px';toast.style.top=O.y+'px';toast.classList.add('show');clearTimeout(close.t);close.t=setTimeout(()=>toast.classList.remove('show'),1200)}
 status();}
function enterChild(g,p){sess.parent=sess.O;const O=clampO(p);sess.armed=Math.hypot(O.x-p.x,O.y-p.y)<=8;sess.O=O;sess.level=g;sess.focus=-1;sess.cand=-1;placeMenu();render(true)}
function goBack(needNeutral){sess.O=sess.parent||sess.O;sess.parent=null;sess.level='root';sess.focus=-1;sess.cand=-1;sess.needNeutral=!!needNeutral;placeMenu();render(true)}
function local(p){return {x:(p.x-sess.O.x)/scale,y:(p.y-sess.O.y)/scale}}
function track(p){cursor=p;marker.style.left=p.x+'px';marker.style.top=p.y+'px';if(!sess)return;
 const prev=[sess.level,sess.focus,sess.cand,sess.armed,sess.needNeutral].join();sess.kb=false;
 const v=local(p),r=Math.hypot(v.x,v.y),a=norm(Math.atan2(v.x,-v.y)*180/Math.PI),hold=mode==='hold';
 if(!sess.armed){if(r<=NEUTRAL){sess.armed=true}else{drawArmLine();return}}
 else if(sess.needNeutral){if(r<=NEUTRAL)sess.needNeutral=false;}
 else if(hold&&sess.level!=='root'&&sess.parent&&Math.hypot(p.x-sess.parent.x,p.y-sess.parent.y)/scale<=NEUTRAL&&Math.hypot(sess.O.x-sess.parent.x,sess.O.y-sess.parent.y)/scale>=104){goBack(false);return}
 else if(!hold&&r>ROUT){sess.focus=-1;sess.cand=-1}
 else{const items=ITEMS(sess.level),w=360/items.length,has=sess.focus>=0;
  if(r<(has?RET:ACQ)){sess.focus=-1;sess.cand=-1}
  else{let idx=items.reduce((b,it,i)=>adiff(a,it.angle)<adiff(a,items[b].angle)?i:b,0);
   if(has&&adiff(a,items[sess.focus].angle)<=w/2+HYST)idx=sess.focus;
   const it=items[idx];sess.focus=idx;sess.cand=it.dis?-1:idx;
   if(hold&&it.kind==='group'&&r>=ENTER){enterChild(it.id,p);return}
   if(hold&&it.kind==='back'){goBack(true);return}}}
 if(prev!==[sess.level,sess.focus,sess.cand,sess.armed,sess.needNeutral].join())render();else drawArmLine();}
function activate(i,viaKey){const items=ITEMS(sess.level),it=items[i];if(!it||it.dis)return;
 if(it.kind==='group'){const p=viaKey?(()=>{const [x,y]=pt(it.angle,ENTER*scale);return {x:sess.O.x+x,y:sess.O.y+y}})():cursor;enterChild(it.id,p);if(viaKey){sess.kb=true;sess.focus=-1;sess.cand=-1;render()}return}
 if(it.kind==='back'){goBack(false);if(viaKey){sess.kb=true;render()}return}
 commit(it);}
function commit(it){const L=sess.level;let msg=it.title,sub='';
 if(L==='pointer'){if(it.id==='all'){close();openBrowser();return}S.pointer=it.id;sub='Pointer'}
 else if(L==='color'){S.ink=it.id;sub='Ink'}
 else if(L==='draw'){S.tool=it.id;sub=S.interact?'Interact off · drawing':'Drawing tool';S.interact=false}
 else if(L==='more'){if(it.id==='redo'){DOC.hist.push(DOC.cur);DOC.cur=DOC.future.pop();sub='Restored'}
  else if(it.id==='sound'){S.sound=!S.sound;msg='Tap sound '+(S.sound?'on':'off')}
  else if(it.id==='mute'){S.mute=!S.mute;msg=S.mute?'All sounds muted':'Sounds on'}
  else if(it.id==='toolbar'){S.toolbar=!S.toolbar;msg='Toolbar '+(S.toolbar?'shown':'hidden')}
  else if(it.id==='settings'){msg='Settings…';sub='Would open Settings'}
  else if(it.id==='off'){msg='Pointer off';sub='Demo only'}}
 else{ if(it.id==='clear'){DOC.hist.push(DOC.cur);DOC.cur=0;DOC.future=[];msg='Drawing cleared';sub='Undo restores it'}
  else if(it.id==='undo'){DOC.future.push(DOC.cur);DOC.cur=DOC.hist.pop();msg='Undo'}
  else if(it.id==='interact'){S.interact=!S.interact;msg=S.interact?'Interact on':'Interact off';sub=S.interact?'Clicks go to apps':'Draw on screen'}
  else if(it.id==='screenshot'){msg='Screenshot';sub='Demo: menu hidden first'}}
 close(msg,sub);drawInk();}
// ---- pointer browser ----
let bFilter='all',bFocus=0,bList=[];
function openBrowser(){browser.className='browser open '+theme;$('bsearch').value='';bFilter='all';[...$('bseg').children].forEach(x=>x.classList.toggle('on',x.dataset.v==='all'));renderBrowser(true);setTimeout(()=>$('bsearch').focus(),0)}
function closeBrowser(silent,msg){if(!browser.classList.contains('open'))return;browser.classList.remove('open');if(!silent&&msg){toast.innerHTML=esc(msg)+'<small>Pointer</small>';const sr=stage.getBoundingClientRect();toast.style.left=sr.width/2+'px';toast.style.top=sr.height/2+'px';toast.classList.add('show');clearTimeout(close.t);close.t=setTimeout(()=>toast.classList.remove('show'),1200)}status()}
function renderBrowser(reset){const q=$('bsearch').value.trim().toLowerCase();bList=CAT.filter(c=>(bFilter==='all'||FAV.includes(c.id))&&c.title.toLowerCase().includes(q));
 if(reset){bFocus=Math.max(0,bList.findIndex(c=>c.id===S.pointer))}bFocus=Math.min(bFocus,Math.max(0,bList.length-1));
 $('bgrid').innerHTML=bList.length?bList.map((c,i)=>`<div class="bcell ${i===bFocus?'f':''}" data-i="${i}"><img src="${c.src}" alt=""><span>${esc(c.title.length>12?c.title.slice(0,11)+'…':c.title)}</span>${S.pointer===c.id?'<span class="chk"><svg width="9" height="9" viewBox="-5 -5 10 10"><path d="M-3.4 .2l2.3 2.3 4.4-4.6" fill="none" stroke="#B6423B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>':''}</div>`).join(''):`<div class="bempty">No pointers match “${esc(q)}”</div>`;
 $('bname').textContent=bList[bFocus]?bList[bFocus].title+(S.pointer===bList[bFocus].id?' (current)':''):'';
 const el=$('bgrid').querySelector('.f');if(el)el.scrollIntoView({block:'nearest'});}
$('bsearch').addEventListener('input',()=>{bFocus=0;renderBrowser()});
$('bseg').addEventListener('click',e=>{const s=e.target.closest('span');if(!s)return;bFilter=s.dataset.v;[...$('bseg').children].forEach(x=>x.classList.toggle('on',x===s));bFocus=0;renderBrowser()});
$('bgrid').addEventListener('click',e=>{const c=e.target.closest('.bcell');if(!c)return;const p=bList[+c.dataset.i];S.pointer=p.id;closeBrowser(false,p.title)});
$('bgrid').addEventListener('mousemove',e=>{const c=e.target.closest('.bcell');if(!c||+c.dataset.i===bFocus)return;bFocus=+c.dataset.i;renderBrowser()});
browser.addEventListener('pointerdown',e=>e.stopPropagation());
function browserKey(e){const cols=Math.max(1,Math.round($('bgrid').clientWidth/72)),k=e.key;
 if(k==='Escape'){e.preventDefault();closeBrowser(true);return}
 if(k==='Enter'){e.preventDefault();const p=bList[bFocus];if(p){S.pointer=p.id;closeBrowser(false,p.title)}return}
 const d={ArrowRight:1,ArrowLeft:-1,ArrowDown:cols,ArrowUp:-cols}[k];if(d&&!(document.activeElement===$('bsearch')&&(k==='ArrowLeft'||k==='ArrowRight')&&$('bsearch').value)){e.preventDefault();bFocus=Math.max(0,Math.min(bList.length-1,bFocus+d));renderBrowser()}}
// ---- ink + status ----
function drawInk(){const strokes=['<path d="M 330 330 C 370 290, 440 290, 470 330" stroke="#8a63d2" stroke-width="5" fill="none" stroke-linecap="round"/>','<path d="M 300 255 l 40 0" stroke="#8a63d2" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M 330 245 l 12 10 -12 10" stroke="#8a63d2" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>'];$('ink').innerHTML=strokes.slice(0,DOC.cur).join('')}
function status(){const p=byId(S.pointer),c=S.ink==='match'?p.ink:INKS.find(i=>i[0]===S.ink)[2];
 $('status').innerHTML=`<img src="${p.src}" alt=""><span>${esc(p.title)}</span><span class="sep">·</span><span class="dot" style="background:${c}"></span><span>${S.interact?'Interact on':esc(toolTitle(S.tool))}</span>`}
// ---- input ----
const sp=e=>{const r=stage.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top}};
stage.addEventListener('pointermove',e=>{if(browser.classList.contains('open'))return;const p=sp(e);if(press)press.last=p;track(p)});
stage.addEventListener('pointerdown',e=>{if(browser.classList.contains('open'))return;const p=sp(e);cursor=p;
 if(mode==='hold'){if(sess)return;press={t:performance.now(),last:p};try{stage.setPointerCapture(e.pointerId)}catch(_){}
  openT=setTimeout(()=>{if(press){open(press.last);track(press.last)}},180);return}
 if(!sess){open(p);track(p);return}
 track(p);const v=local(p),r=Math.hypot(v.x,v.y);
 if(r>ROUT){downIdx='outside';return}
 if(r<RIN){downIdx='hub';return}
 downIdx=sess.focus;});
stage.addEventListener('pointerup',e=>{const p=sp(e);
 if(mode==='hold'){clearTimeout(openT);const had=press;press=null;if(!had||!sess)return;track(p);
  if(sess.cand>=0&&sess.armed&&!sess.needNeutral){const it=ITEMS(sess.level)[sess.cand];if(it.kind==='leaf'||it.kind==='cmd'){commit(it);return}}
  close();return}
 if(!sess||downIdx==null)return;track(p);const v=local(p),r=Math.hypot(v.x,v.y),d=downIdx;downIdx=null;
 if(d==='outside'){if(r>ROUT)close();return}
 if(d==='hub'){if(r<RIN){if(sess.level==='root')close();else goBack(false)}return}
 if(d===sess.focus&&d>=0&&sess.armed)activate(d,false);});
document.addEventListener('keydown',e=>{if(browser.classList.contains('open')){browserKey(e);return}if(!sess)return;const k=e.key,items=ITEMS(sess.level),hold=mode==='hold';
 if(k==='Escape'){e.preventDefault();if(hold||sess.level==='root')close();else{goBack(false);sess.kb=true;render()}return}
 if(k==='Backspace'&&!hold){e.preventDefault();if(sess.level!=='root'){goBack(false);sess.kb=true;render()}return}
 const order=items.map((it,i)=>i).sort((x,y)=>items[x].angle-items[y].angle);
 const mv=(k==='Tab'&&!e.shiftKey)||k==='ArrowRight'?1:(k==='Tab'&&e.shiftKey)||k==='ArrowLeft'?-1:0;
 if(mv){e.preventDefault();const pos=order.indexOf(sess.focus);const nx=order[(pos<0?(mv>0?0:order.length-1):(pos+mv+order.length)%order.length)];sess.focus=nx;sess.cand=items[nx].dis?-1:nx;sess.kb=true;sess.armed=true;sess.needNeutral=false;render();return}
 if(/^[1-8]$/.test(k)&&sess.level==='root'){const i=+k-1;sess.focus=i;sess.cand=items[i].dis?-1:i;sess.kb=true;render();return}
 if((k==='Enter'||k===' ')&&sess.focus>=0){e.preventDefault();activate(sess.focus,true)}});
// ---- controls ----
function seg(id,cb){$(id).addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;[...$(id).children].forEach(x=>x.classList.toggle('on',x===b));cb(b.dataset.v)})}
const HINT={click:'Click mode (the “Open Quick controls” shortcut): hover previews, click a category to open it, click a choice to apply. Click outside or press Esc to close. Click the slide to reopen. Keys: Tab or arrows, Return, Esc, 1–8.',
 hold:'Hold mode (the held modifier): press and hold on the slide; the menu opens after 180 ms. Move toward a category to open it where you are, keep moving to a choice, release to apply. Release in the center cancels. Try it near a corner.'};
seg('modeSeg',v=>{mode=v;close();closeBrowser(true);$('hint').textContent=HINT[v];if(v==='click'){const sr=stage.getBoundingClientRect();open({x:sr.width/2,y:sr.height/2})}});
seg('themeSeg',v=>{theme=v;menu.classList.remove('dark','light');menu.classList.add(v);if(browser.classList.contains('open'))browser.className='browser open '+v;render()});
seg('motionSeg',v=>stage.classList.toggle('reduce',v==='reduce'));
$('hint').textContent=HINT.click;drawInk();status();
{const sr=stage.getBoundingClientRect();open({x:sr.width/2,y:sr.height/2});const [x,y]=pt(0,118);track({x:sr.width/2+x*scale,y:sr.height/2+y*scale});}
</script>
</body></html>
