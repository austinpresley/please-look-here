<!doctype html>
<html><head><meta charset="utf-8">
<style>
*{box-sizing:border-box}
body{font-family:var(--font-sans);color:var(--foreground);font-size:14px;line-height:1.5}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 10px}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.seg button{font:inherit;font-size:12px;padding:4px 10px;border:0;background:transparent;color:var(--muted-foreground);cursor:pointer}
.seg button.on{background:var(--secondary);color:var(--foreground);font-weight:600}
.hintline{font-size:12px;color:var(--muted-foreground)}
.stage{position:relative;height:560px;border-radius:var(--radius);overflow:hidden;user-select:none;-webkit-user-select:none;
  background:radial-gradient(1200px 600px at 20% 10%,#5b6cff55,transparent 60%),radial-gradient(900px 500px at 90% 90%,#ff7a5c55,transparent 60%),linear-gradient(135deg,#1d2433,#2b2035)}
.slide{position:absolute;left:6%;top:7%;right:6%;bottom:16%;border-radius:10px;background:#f7f5f0;box-shadow:0 20px 50px #0006;padding:26px 30px;color:#2a2a2e;overflow:hidden}
.slide h5{margin:0 0 4px;font-size:20px}
.slide p{margin:0 0 16px;font-size:12px;color:#6b6b70}
.bars{display:flex;align-items:flex-end;gap:16px;height:55%}
.bars div{flex:1;border-radius:6px 6px 0 0;background:#c9cbd6}
.bars div.hi{background:#f0614a}
.ink{position:absolute;inset:0;pointer-events:none}
.status{position:absolute;left:12px;bottom:12px;display:flex;align-items:center;gap:8px;padding:6px 10px 6px 6px;border-radius:999px;background:#000a;color:#fff;font-size:12px;backdrop-filter:blur(10px)}
.status img{width:24px;height:24px}
.status .dot{width:12px;height:12px;border-radius:50%;border:1px solid #fff8}
.menu{position:absolute;width:520px;height:520px;margin:-260px 0 0 -260px;pointer-events:none;opacity:0;transform:scale(.98);transition:opacity .12s cubic-bezier(.2,0,0,1),transform .12s cubic-bezier(.2,0,0,1)}
.menu.open{opacity:1;transform:scale(var(--s,1))}
.reduce .menu,.reduce .menu *{transition:opacity .12s linear!important}
.reduce .menu{transform:scale(var(--s,1))}
.glass{position:absolute;left:50%;top:50%;border-radius:50%;transform:translate(-50%,-50%);backdrop-filter:blur(22px) saturate(1.6);-webkit-backdrop-filter:blur(22px) saturate(1.6)}
.g-root{width:292px;height:292px}
.fanglass{position:absolute;inset:0;backdrop-filter:blur(22px) saturate(1.6);-webkit-backdrop-filter:blur(22px) saturate(1.6);transition:opacity .14s}
svg.m{position:absolute;inset:0;overflow:visible}
/* themes */
.dark{--mfan:rgba(34,34,38,.9);--mfill:rgba(30,30,34,.74);--mhub:rgba(58,58,64,.82);--mline:rgba(255,255,255,.10);--mtext:#f4f4f6;--msub:rgba(235,235,245,.62);--mdis:rgba(235,235,245,.28);--mrim:rgba(255,255,255,.16)}
.light{--mfan:rgba(250,250,252,.93);--mfill:rgba(250,250,252,.80);--mhub:rgba(255,255,255,.92);--mline:rgba(0,0,0,.08);--mtext:#1d1d1f;--msub:rgba(60,60,67,.66);--mdis:rgba(60,60,67,.30);--mrim:rgba(0,0,0,.10)}
.menu{--acc:#ee5a43;--acc2:#ff8a63}
.wedge path.bg{fill:transparent;transition:fill .06s}
.wedge.hl path.bg{fill:url(#accgrad)}
.wedge.par path.bg{fill:rgba(238,90,67,.22)}
.ic{color:var(--mtext)}
.wedge .ic{color:var(--mtext);transition:transform .12s cubic-bezier(.2,.9,.3,1.3)}
.wedge.hl .ic{color:#fff}
.wedge.dis .ic{color:var(--mdis)}
.wedge text{fill:var(--mtext);font:600 12px var(--font-sans);text-anchor:middle}
.wedge.hl text{fill:#fff}
.wedge.dis text{fill:var(--mdis)}
.wedge.dis.hl path.bg{fill:transparent;stroke:var(--mdis);stroke-dasharray:3 3}
.wedge.dis.hl .ic{color:var(--mdis)}
.wedge.dis.hl text{fill:var(--mdis)}
.wedge .cur{fill:var(--acc)}
.wedge.hl .cur{fill:#fff}
.fan{transition:opacity .14s}
.fan.preview{opacity:.55}
.cell path.bg{fill:transparent;transition:fill .08s}
.cell.hl path.bg{fill:url(#accgrad)}
.fan.color .cell.hl path.bg{fill:rgba(238,90,67,.16);stroke:var(--acc);stroke-width:2}
.fan.color .cell.hl .ring{stroke:var(--acc)}
.cell .ic{color:var(--mtext)}
.cell.hl .ic{color:#fff}
.cell text{fill:var(--mtext);font:600 11px var(--font-sans);text-anchor:middle}
.cell.hl text{fill:#fff}
.cell .ring{fill:none;stroke:var(--acc);stroke-width:2}
.cell.hl .ring{stroke:#fff}
.hubt{fill:var(--mtext);font:650 12px var(--font-sans);text-anchor:middle}
.hubs{fill:var(--msub);font:500 10px var(--font-sans);text-anchor:middle}
.toast{position:absolute;transform:translate(-50%,-50%) scale(.96);padding:7px 14px;border-radius:999px;background:rgba(28,28,32,.86);color:#fff;font:600 12px var(--font-sans);display:flex;gap:8px;align-items:center;opacity:0;transition:opacity .16s,transform .16s;pointer-events:none;backdrop-filter:blur(12px);white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.toast small{font-weight:500;opacity:.7}
.grid{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:236px;padding:12px;border-radius:22px;background:var(--mfill);backdrop-filter:blur(24px) saturate(1.6);box-shadow:0 0 0 1px var(--mrim),0 18px 40px #0006;display:none;grid-template-columns:repeat(4,1fr);gap:6px}
.grid.open{display:grid}
.grid .g{height:48px;border-radius:12px;display:grid;place-items:center;position:relative}
.grid .g img{width:36px;height:36px}
.grid .g.hl{background:linear-gradient(135deg,var(--acc2),var(--acc))}
.grid .g.sel::after{content:"";position:absolute;bottom:4px;width:5px;height:5px;border-radius:50%;background:var(--acc)}
.grid .g.hl.sel::after{background:#fff}
.grid .cap{grid-column:1/-1;text-align:center;font:600 11px var(--font-sans);color:var(--mtext);padding-top:2px}
.trail{position:absolute;inset:0;pointer-events:none}
</style></head>
<body>
<div class="bar">
  <div class="seg" id="modeSeg"><button data-v="explore" class="on">Click mode</button><button data-v="hold">Hold mode</button></div>
  <div class="seg" id="themeSeg"><button data-v="dark" class="on">Dark</button><button data-v="light">Light</button></div>
  <div class="seg" id="motionSeg"><button data-v="full" class="on">Motion</button><button data-v="reduce">Reduce Motion</button></div>
  <span class="hintline" id="hint">Move over the menu: categories preview their choices outward. Move out to pick, click to apply. Keys: 1–8, arrows, Return, Esc.</span>
</div>
<div class="stage" id="stage">
  <div class="slide"><h5>Q4 launch review</h5><p>Point it out. Draw it on screen.</p>
    <div class="bars"><div style="height:40%"></div><div style="height:62%"></div><div class="hi" style="height:88%"></div><div style="height:55%"></div><div style="height:70%"></div></div></div>
  <svg class="ink"><path d="M 400 300 C 430 270, 480 270, 500 300" stroke="#8a63d2" stroke-width="5" fill="none" stroke-linecap="round" opacity=".9"/></svg>
  <svg class="trail" id="trail"></svg>
  <div class="status" id="status"></div>
  <div class="menu dark" id="menu">
    <div class="glass g-root" id="groot"></div>
    <svg class="m" viewBox="-260 -260 520 520" id="svg"></svg>
    <div class="grid" id="grid"></div>
  </div>
  <div class="toast" id="toast"></div>
</div>
<script>
const SRC={lavender:'/Volumes/Project-Vault/PROJECTS/Please Look Here/6c6176656e646572.png',coral:'/Volumes/Project-Vault/PROJECTS/Please Look Here/636f72616c.png',plush:'/Volumes/Project-Vault/PROJECTS/Please Look Here/706c757368.png',robot:'/Volumes/Project-Vault/PROJECTS/Please Look Here/726f626f74.png',laser:'/Volumes/Project-Vault/PROJECTS/Please Look Here/6c61736572.png',spotlight:'/Volumes/Project-Vault/PROJECTS/Please Look Here/73706f746c69676874.png',presentation:'/Volumes/Project-Vault/PROJECTS/Please Look Here/70726573656e746174696f6e.png',mint:'/Volumes/Project-Vault/PROJECTS/Please Look Here/6d696e74.png',lemon:'/Volumes/Project-Vault/PROJECTS/Please Look Here/6c656d6f6e.png',pink:'/Volumes/Project-Vault/PROJECTS/Please Look Here/70696e6b.png',blue:'/Volumes/Project-Vault/PROJECTS/Please Look Here/626c7565.png',chrome:'/Volumes/Project-Vault/PROJECTS/Please Look Here/6368726f6d65.png',space:'/Volumes/Project-Vault/PROJECTS/Please Look Here/7370616365.png',pixel:'/Volumes/Project-Vault/PROJECTS/Please Look Here/706978656c.png',wood:'/Volumes/Project-Vault/PROJECTS/Please Look Here/776f6f64.png',neon:'/Volumes/Project-Vault/PROJECTS/Please Look Here/6e656f6e.png'};
const P=(id,title)=>({id,title,src:SRC[id]});
const POINTERS=[P('lavender','Lavender toy'),P('coral','Coral vinyl'),P('plush','Plush'),P('robot','Robot'),P('laser','Laser dot'),P('spotlight','Spotlight')];
const ALL=POINTERS.concat([P('presentation','Presentation pointer'),P('mint','Mint'),P('lemon','Lemon'),P('pink','Bubblegum'),P('blue','Sky'),P('chrome','Chrome'),P('space','Space'),P('pixel','Pixel'),P('wood','Wood'),P('neon','Neon')]);
const INKS=[['match','Match the pointer','conic'],['red','Red','#ff3b30'],['orange','Orange','#ff9500'],['yellow','Yellow','#ffcc00'],['green','Green','#34c759'],['blue','Blue','#0a84ff'],['purple','Purple','#8a63d2'],['white','White','#ffffff'],['black','Black','#1c1c1e']];
const TOOLS=[['pen','Pen'],['highlighter','Highlighter'],['rectangle','Rectangle'],['arrow','Arrow'],['text','Text'],['number','Number'],['eraser','Eraser']];
const ICON={
 trash:'<path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 13h9l1-13M10 11v5.5M14 11v5.5"/>',
 camera:'<path d="M3.5 8.5h3.5l1.8-2.6h6.4l1.8 2.6h3.5V19h-17z"/><circle cx="12" cy="13.2" r="3.4"/>',
 undo:'<path d="M9 5.5L4 10.5l5 5M4.5 10.5H14a5.5 5.5 0 0 1 0 11h-3"/>',
 redo:'<path d="M15 5.5l5 5-5 5M19.5 10.5H10a5.5 5.5 0 0 0 0 11h3"/>',
 more:'<circle cx="5.5" cy="12" r="1.7" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.7" fill="currentColor" stroke="none"/><circle cx="18.5" cy="12" r="1.7" fill="currentColor" stroke="none"/>',
 interact:'<path d="M6 3.5l12 8.8-5.6 1.1 3.2 6.3-2.5 1.2-3.1-6.4L6 18.5z" stroke-linejoin="round"/>',
 pen:'<path d="M4.5 19.5l1-4.2L16 4.8l3.2 3.2L8.7 18.5zM13.8 7l3.2 3.2"/>',
 highlighter:'<path d="M7 16.5l-2 2.2V20h4l1.6-1.7M7 16.5l8.6-12 4 4-12 8.6zM3.5 21.5h9" stroke-linejoin="round"/>',
 rectangle:'<rect x="4" y="6" width="16" height="12" rx="2.2"/>',
 arrow:'<path d="M5 19L18.5 5.5M10 5h9v9"/>',
 text:'<path d="M5.5 6h13M12 6v13.5M9 19.5h6"/>',
 number:'<circle cx="12" cy="12" r="8.5"/><path d="M10.6 9.2l2-1.2v8"/>',
 eraser:'<path d="M4.5 14.5l8.6-9.2 6.4 6.2-8 8.5H8.5zM9 10l6.3 6.2M8.5 20h11"/>',
 sound:'<path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4zM15.5 9a4 4 0 0 1 0 6M18 6.5a7.6 7.6 0 0 1 0 11"/>',
 mute:'<path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4zM16 9.5l5 5M21 9.5l-5 5"/>',
 toolbar:'<rect x="3" y="5" width="18" height="14" rx="2.4"/><path d="M3 9.5h18"/>',
 gear:'<circle cx="12" cy="12" r="3"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M5.6 18.4l1.8-1.8M16.6 7.4l1.8-1.8"/>',
 power:'<path d="M12 3.5v8M7.2 6.8a7.2 7.2 0 1 0 9.6 0"/>',
 grid:'<rect x="4" y="4" width="6.5" height="6.5" rx="1.6"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.6"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.6"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.6"/>'
};
const S={pointer:'lavender',ink:'match',tool:'pen',interact:false,toolbar:true,sound:false,mute:false,undo:3,redo:0,ink_on:true};
const R0=52,R1=142,F0=154,F1=232,SPLIT=148;
const svgNS='http://www.w3.org/2000/svg';
const $=id=>document.getElementById(id);
const stage=$('stage'),menu=$('menu'),svg=$('svg'),grid=$('grid'),toast=$('toast'),trail=$('trail');
let mode='explore',theme='dark',open=false,cx=0,cy=0,scale=1;
let hlRoot=-1,fanGroup=null,fanActive=false,hlCell=-1,gridOpen=false,hlGrid=-1,sticky=false;
const pt=(a,r)=>[Math.sin(a*Math.PI/180)*r,-Math.cos(a*Math.PI/180)*r];
function arc(r0,r1,a0,a1,o=0){const q=(a,r)=>{const [x,y]=pt(a,r);return (x+o).toFixed(2)+' '+(y+o).toFixed(2)};const l=(a1-a0)>180?1:0;
 return `M${q(a0,r1)}A${r1} ${r1} 0 ${l} 1 ${q(a1,r1)}L${q(a1,r0)}A${r0} ${r0} 0 ${l} 0 ${q(a0,r0)}Z`;}
const ptr=id=>ALL.find(p=>p.id===id)||POINTERS[0];
const inkOf=id=>INKS.find(i=>i[0]===id);
const CON=['#ff3b30','#ff9500','#ffcc00','#34c759','#0a84ff','#8a63d2'];
function swatch(c,r){if(c==='conic'){return `<circle r="${r+1}" fill="var(--mhub)" stroke="rgba(127,127,127,.45)"/><image href="${ptr(S.pointer).src}" x="${-r}" y="${-r-1}" width="${2*r}" height="${2*r}"/>`}return c==='conic'?CON.map((k,i)=>{const a0=i*60,a1=a0+60,[x0,y0]=pt(a0,r),[x1,y1]=pt(a1,r);return `<path d="M0 0L${x0} ${y0}A${r} ${r} 0 0 1 ${x1} ${y1}Z" fill="${k}"/>`}).join('')+`<circle r="${r}" fill="none" stroke="rgba(127,127,127,.45)"/>`:`<circle r="${r}" fill="${c}" stroke="rgba(127,127,127,.45)" stroke-width="1"/>`}
function icon(name,size=22){return `<g class="ic" transform="translate(${-size/2} ${-size/2}) scale(${size/24})" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICON[name]}</g>`}
function ROOT(){return [
 {id:'pointer',title:'Pointer',group:'pointer',sub:ptr(S.pointer).title,art:()=>`<image href="${ptr(S.pointer).src}" x="-17" y="-19" width="34" height="34"/>`},
 {id:'color',title:'Color',group:'color',sub:inkOf(S.ink)[1],art:()=>swatch(inkOf(S.ink)[2],10)},
 {id:'tool',title:'Draw',group:'tool',sub:TOOLS.find(t=>t[0]===S.tool)[1],art:()=>icon(S.tool)},
 {id:'clear',title:'Clear',sub:'Undo restores',art:()=>icon('trash'),dis:!S.ink_on},
 {id:'interact',title:'Interact',sub:S.interact?'Turn off to draw':'Clicks go to apps',art:()=>icon('interact'),cur:S.interact,badge:S.interact?'ON':'OFF'},
 {id:'capture',title:'Screenshot',sub:'This display',art:()=>icon('camera')},
 {id:'undo',title:'Undo',sub:S.undo?'Last stroke':'Nothing to undo',art:()=>icon('undo'),dis:!S.undo},
 {id:'more',title:'More',group:'more',sub:'Sound, Settings…',art:()=>icon('more')}];}
function GROUP(g){
 if(g==='pointer')return POINTERS.map(p=>({id:p.id,title:p.title,cur:S.pointer===p.id,art:()=>`<image href="${p.src}" x="-21" y="-23" width="42" height="42"/>`})).concat([{id:'all',title:'All pointers…',art:()=>icon('grid',20),label:'All'}]);
 if(g==='color')return INKS.map(i=>({id:i[0],title:i[1],cur:S.ink===i[0],art:()=>swatch(i[2],12)}));
 if(g==='tool')return TOOLS.map(t=>({id:t[0],title:t[1],cur:S.tool===t[0]&&!S.interact,art:()=>icon(t[0],20),label:t[1]}));
 if(g==='more')return [{id:'redo',title:'Redo',art:()=>icon('redo',20),label:'Redo',dis:!S.redo},{id:'sound',title:'Tap sound',art:()=>icon('sound',20),label:'Tap sound',cur:S.sound},{id:'mute',title:'Mute all',art:()=>icon('mute',20),label:'Mute',cur:S.mute},{id:'toolbar',title:'Toolbar',art:()=>icon('toolbar',20),label:'Toolbar',cur:S.toolbar},{id:'settings',title:'Settings…',art:()=>icon('gear',20),label:'Settings'},{id:'off',title:'Pointer Off',art:()=>icon('power',20),label:'Off'}];
 return [];}
const rootAngle=i=>i*45;
function fanGeom(g){const items=GROUP(g),n=items.length,step=Math.min(28,Math.max(16,150/n)),ga=rootAngle(ROOT().findIndex(r=>r.group===g));
 return {items,n,step,ga,start:ga-step*n/2};}
function render(){
 const root=ROOT();let h=`<defs><linearGradient id="accgrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff8a63"/><stop offset="1" stop-color="#e8503c"/></linearGradient>
 </defs>`;
 // ring base
 h+=`<circle r="${R1}" fill="var(--mfill)"/><circle r="${R1-.5}" fill="none" stroke="var(--mrim)"/>`;
 // fan
 if(fanGroup){const f=fanGeom(fanGroup);
  h+=`<g class="fan ${fanGroup} ${fanActive||gridOpen?'':'preview'}" style="opacity:${gridOpen?0.15:''}"><path d="${arc(F0,F1,f.start,f.start+f.step*f.n)}" fill="var(--mfan)" stroke="var(--mrim)"/>`;
  f.items.forEach((it,i)=>{const a0=f.start+i*f.step,a1=a0+f.step,[x,y]=pt((a0+a1)/2,(F0+F1)/2+(it.label?4:0));
   h+=`<g class="cell ${hlCell===i&&fanActive?'hl':''}" style="opacity:${it.dis?.4:1}"><path class="bg" d="${arc(F0+3,F1-3,a0+.8,a1-.8)}" rx="8"/>
   <g transform="translate(${x} ${y-(it.label?8:0)})">${it.art()}${it.cur&&!it.label?`<circle class="ring" r="${fanGroup==='pointer'?24:16}"/>`:''}</g>
   ${it.label?`<text x="${x}" y="${y+15}">${it.label}</text>`:''}${it.cur&&it.label?`<circle class="cur" cx="${x}" cy="${y+22}" r="2.2" style="fill:${hlCell===i&&fanActive?'#fff':'var(--acc)'}"/>`:''}</g>`;});
  h+=`</g>`;}
 // root wedges
 root.forEach((it,i)=>{const a=rootAngle(i),[x,y]=pt(a,(R0+R1)/2+(it.badge?-4:2)),hl=hlRoot===i&&!fanActive&&!gridOpen,push=[0,0];
  const par=(fanActive||gridOpen)&&it.group===fanGroup;h+=`<g class="wedge ${hl?'hl':''} ${it.dis?'dis':''} ${par?'par':''}" transform="translate(${push[0]} ${push[1]})"><path class="bg" d="${arc(R0+3,R1-3,a-22.5+.9,a+22.5-.9)}"/>
  <g transform="translate(${x} ${y-8})">${it.art()}</g><text x="${x}" y="${y+21}">${it.title}</text>
  ${it.group?`<path d="${arc(R1-8,R1-5,a-7,a+7)}" fill="${hl?'#fff':'var(--msub)'}" opacity="${hl?1:.55}"/>`:''}
  ${it.badge?`<g transform="translate(${x} ${y+33})"><rect x="-13" y="-6.5" width="26" height="13" rx="6.5" fill="${it.cur?(hl?'#fff':'var(--acc)'):'none'}" stroke="${it.cur?'none':(hl?'#fff':'var(--msub)')}"/><text y="3.5" style="font:700 8px var(--font-sans);fill:${it.cur?(hl?'var(--acc)':'#fff'):(hl?'#fff':'var(--msub)')}">${it.badge}</text></g>`:(it.cur?`<circle class="cur" cx="${x}" cy="${y+30}" r="2.2"/>`:'')}</g>`;});
 // dividers
 for(let i=0;i<8;i++){const a=i*45+22.5,[x0,y0]=pt(a,R0+6),[x1,y1]=pt(a,R1-8);h+=`<line x1="${x0}" y1="${y0}" x2="${x1}" y2="${y1}" stroke="var(--mline)"/>`}
 // hub
 const sel=gridOpen?(hlGrid>=0?{title:ALL[hlGrid].title,sub:''}:{title:'All pointers',sub:'Move out: back'}):
  fanActive&&hlCell>=0?fanGeom(fanGroup).items[hlCell]:(hlRoot>=0?root[hlRoot]:null);
 h+=`<circle r="${R0-2}" fill="var(--mhub)" stroke="var(--mrim)"/>`;
 if(sel&&fanActive&&hlCell>=0&&!gridOpen){const t=sel.title;h+=`<g transform="translate(0 -9) scale(${fanGroup==='pointer'?.95:1.35})">${sel.art()}</g><text class="hubt" y="${fanGroup==='pointer'?28:26}">${t.length>15?t.slice(0,14)+'…':t}</text>`;}
 else if(sel){const t=sel.title,s=fanActive&&hlCell>=0?(sel.cur?'Current':(fanGroup==='tool'?'Starts drawing':'')):(sel.group?(fanGroup===sel.group?'Move out':''):sel.sub)||'';
  h+=`<text class="hubt" y="${s?-1:4}">${t.length>15?t.slice(0,14)+'…':t}</text>${s?`<text class="hubs" y="13">${s.length>18?s.slice(0,17)+'…':s}</text>`:''}`;}
 else h+=`<image href="${ptr(S.pointer).src}" x="-19" y="-24" width="38" height="38"/><text class="hubs" y="29">${mode==='hold'?'Release here cancels':'Esc closes'}</text>`;
 // direction needle
 if(lastAngle!=null&&lastR>R0-6){const [x0,y0]=pt(lastAngle-14,R0+1),[x1,y1]=pt(lastAngle+14,R0+1);h+=`<path d="M${x0} ${y0}A${R0+1} ${R0+1} 0 0 1 ${x1} ${y1}" stroke="var(--acc)" stroke-width="3" fill="none" stroke-linecap="round"/>`;}
 svg.innerHTML=h;
 // fan glass clip
 renderGrid();}
function renderGrid(){grid.classList.toggle('open',gridOpen);if(!gridOpen)return;
 grid.innerHTML=ALL.map((p,i)=>`<div class="g ${i===hlGrid?'hl':''} ${S.pointer===p.id?'sel':''}"><img src="${p.src}" alt="${p.title}"></div>`).join('')+`<div class="cap">${hlGrid>=0?ALL[hlGrid].title:'Enabled pointers'}</div>`;}
let lastAngle=null,lastR=0,maxR=0;
function local(e){const r=stage.getBoundingClientRect();return [(e.clientX-r.left-cx)/scale,(e.clientY-r.top-cy)/scale,e.clientX-r.left,e.clientY-r.top]}
function hit(dx,dy){const r=Math.hypot(dx,dy);maxR=Math.max(maxR,r);let a=Math.atan2(dx,-dy)*180/Math.PI;if(a<0)a+=360;lastAngle=a;lastR=r;
 const prev=[hlRoot,fanGroup,fanActive,hlCell,hlGrid,gridOpen].join();
 if(gridOpen){const gr=grid.getBoundingClientRect(),sr=stage.getBoundingClientRect();
  const gx=cx+dx*scale+sr.left,gy=cy+dy*scale+sr.top;
  if(gx>=gr.left-24&&gx<=gr.right+24&&gy>=gr.top-24&&gy<=gr.bottom+24){hlGrid=-1;[...grid.querySelectorAll('.g')].forEach((el,i)=>{const b=el.getBoundingClientRect();if(gx>=b.left&&gx<=b.right&&gy>=b.top&&gy<=b.bottom)hlGrid=i});}
  else{gridOpen=false;hlGrid=-1}
  if(gridOpen){if(prev!==[hlRoot,fanGroup,fanActive,hlCell,hlGrid,gridOpen].join())render();else updNeedle();return;}}
 const root=ROOT();
 if(r<R0-6){hlRoot=-1;fanActive=false;hlCell=-1;if(!sticky)fanGroup=null}
 else{let ri=Math.round(a/45)%8;if(hlRoot>=0&&!fanActive){let d=Math.abs(((a-hlRoot*45)%360+540)%360-180);if(d<=22.5+4)ri=hlRoot;}
  let inFan=false;
  if(r>=SPLIT&&fanGroup){const f=fanGeom(fanGroup);let d=((a-f.start)%360+360)%360;if(d>180+f.step*f.n/2)d-=360;
   if(d>=-10&&d<=f.step*f.n+10){inFan=true;fanActive=true;hlCell=Math.max(0,Math.min(f.n-1,Math.floor(d/f.step)));if(f.items[hlCell].dis)hlCell=-1}}
  if(!inFan){fanActive=false;hlCell=-1;hlRoot=ri;fanGroup=root[ri].group||(sticky?fanGroup:null);}
  else hlRoot=root.findIndex(x=>x.group===fanGroup);}
 if(prev!==[hlRoot,fanGroup,fanActive,hlCell,hlGrid,gridOpen].join())render();else updNeedle();}
function updNeedle(){const p=svg.querySelector('path[stroke="var(--acc)"]');if(!p||lastAngle==null){render();return}
 const [x0,y0]=pt(lastAngle-14,R0+1),[x1,y1]=pt(lastAngle+14,R0+1);p.setAttribute('d',`M${x0} ${y0}A${R0+1} ${R0+1} 0 0 1 ${x1} ${y1}`);}
function commit(){let msg=null,sub='';
 if(gridOpen){if(hlGrid>=0){S.pointer=ALL[hlGrid].id;msg=ALL[hlGrid].title;sub='Pointer'}else return close('Canceled');}
 else if(fanActive&&hlCell>=0){const it=fanGeom(fanGroup).items[hlCell];
  if(fanGroup==='pointer'){if(it.id==='all'){gridOpen=true;sticky=true;hlGrid=-1;render();return 'stay'}S.pointer=it.id;msg=it.title;sub='Pointer'}
  if(fanGroup==='color'){S.ink=it.id;msg=it.title;sub='Ink'}
  if(fanGroup==='tool'){S.tool=it.id;S.interact=false;msg=it.title;sub='Draw'}
  if(fanGroup==='more'){if(it.id==='redo'){S.redo--;S.undo++;msg='Redo'}else if(it.id==='sound'){S.sound=!S.sound;msg='Tap sound '+(S.sound?'on':'off')}else if(it.id==='mute'){S.mute=!S.mute;msg=S.mute?'All sounds muted':'Sounds on'}else if(it.id==='toolbar'){S.toolbar=!S.toolbar;msg='Toolbar '+(S.toolbar?'shown':'hidden')}else if(it.id==='settings'){msg='Opening Settings…'}else{msg='Pointer Off'}}}
 else if(hlRoot>=0){const it=ROOT()[hlRoot];
  if(it.dis){return close(it.title+' unavailable',it.sub)}
  if(it.group){sticky=true;fanGroup=it.group;render();return 'stay'}
  if(it.id==='clear'){S.ink_on=false;S.undo++;msg='Drawing cleared';sub='Undo restores'}
  if(it.id==='interact'){S.interact=!S.interact;msg=S.interact?'Interact On':'Interact Off';sub=S.interact?'Use apps below':'Draw on screen'}
  if(it.id==='capture'){msg='Screenshot saved';sub='Captures'}
  if(it.id==='undo'){S.undo--;S.redo++;if(!S.undo)S.ink_on=false;msg='Undo'}}
 else return close('Canceled');
 close(msg,sub);}
function show(x,y){const sr=stage.getBoundingClientRect();scale=Math.min(1,(sr.width-16)/480);menu.style.setProperty('--s',scale);
 const m=240*scale;cx=Math.min(Math.max(x,m),sr.width-m);cy=Math.min(Math.max(y,m),sr.height-m);
 menu.style.left=cx+'px';menu.style.top=cy+'px';hlRoot=-1;fanGroup=null;fanActive=false;hlCell=-1;gridOpen=false;sticky=false;lastAngle=null;maxR=0;render();
 requestAnimationFrame(()=>menu.classList.add('open'));open=true;}
function close(msg,sub){open=false;menu.classList.remove('open');if(msg){toast.innerHTML=msg+(sub?` <small>${sub}</small>`:'');toast.style.left=cx+'px';toast.style.top=cy+'px';toast.classList.add('show');clearTimeout(close.t);close.t=setTimeout(()=>toast.classList.remove('show'),700)}
 status();if(mode==='explore')setTimeout(()=>{if(mode==='explore'&&!open)show(stage.clientWidth/2,stage.clientHeight/2)},900);}
function status(){const p=ptr(S.pointer),ink=inkOf(S.ink);$('status').innerHTML=`<img src="${p.src}"><span>${p.title}</span><span class="dot" style="background:${ink[2]==='conic'?'#b9a4e8':ink[2]}" title="${ink[1]}"></span><span>${S.interact?'Interact On':TOOLS.find(t=>t[0]===S.tool)[1]}</span>`;}
// interaction
let press=null,marking=false,revealT=null,pts=[];
stage.addEventListener('pointermove',e=>{const [dx,dy,sx,sy]=local(e);
 if(mode==='hold'&&press){pts.push([sx,sy]);
  if(marking){trail.innerHTML=`<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#ee5a43" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>`;return}}
 if(open)hit(dx,dy);});
stage.addEventListener('pointerdown',e=>{const [,,sx,sy]=local(e);
 if(mode==='explore'){if(open){const [dx,dy]=local(e);hit(dx,dy);commit()}return}
 if(open&&sticky){const [dx,dy]=local(e);hit(dx,dy);const r=commit();return}
 press={x:sx,y:sy,t:performance.now()};pts=[[sx,sy]];marking=false;try{stage.setPointerCapture(e.pointerId)}catch(_){}
 revealT=setTimeout(()=>{if(press){const q=pts[pts.length-1];show(q[0],q[1]);hit((q[0]-cx)/scale,(q[1]-cy)/scale)}},180);});
stage.addEventListener('pointerup',e=>{if(mode!=='hold'||!press)return;clearTimeout(revealT);
 const dt=performance.now()-press.t;
 if(marking){const [sx,sy]=pts[pts.length-1];const dx=sx-press.x,dy=sy-press.y;let a=Math.atan2(dx,-dy)*180/Math.PI;if(a<0)a+=360;const ri=Math.round(a/45)%8,it=ROOT()[ri];
  trail.innerHTML='';press=null;marking=false;
  if(it.group){show(press?0:pts[0][0],pts[0][1]);sticky=true;fanGroup=it.group;render();return}
  cx=pts[0][0];cy=pts[0][1];hlRoot=ri;fanActive=false;gridOpen=false;if(it.dis){close('Unavailable');return}commit();return}
 press=null;if(!open){return}
 if(dt<180){close();return}
 const r=commit();});
document.addEventListener('keydown',e=>{if(!open)return;const k=e.key;
 if(k==='Escape'){e.preventDefault();if(gridOpen){gridOpen=false;render()}else if(fanActive||sticky&&fanGroup){fanActive=false;hlCell=-1;sticky=false;render()}else if(mode==='hold')close('Canceled');return}
 if(/^[1-8]$/.test(k)){const [x,y]=pt((+k-1)*45,90);hit(x,y);return}
 if(k==='ArrowLeft'||k==='ArrowRight'){e.preventDefault();const d=k==='ArrowRight'?1:-1;
  if(fanActive){const f=fanGeom(fanGroup);hlCell=(Math.max(0,hlCell)+d+f.n)%f.n;render()}else{const ri=((hlRoot<0?0:hlRoot+d)+8)%8;const [x,y]=pt(ri*45,90);hit(x,y)}return}
 if(k==='ArrowUp'&&!fanActive&&fanGroup){e.preventDefault();fanActive=true;sticky=true;const f=fanGeom(fanGroup);hlCell=Math.floor(f.n/2);render();return}
 if(k==='ArrowDown'&&fanActive){e.preventDefault();fanActive=false;hlCell=-1;render();return}
 if(k==='Enter'||k===' '){e.preventDefault();commit()}});
function seg(id,cb){$(id).addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;[...$(id).children].forEach(x=>x.classList.toggle('on',x===b));cb(b.dataset.v)})}
seg('modeSeg',v=>{mode=v;close();$('hint').textContent=v==='hold'?'Press and hold anywhere (stands in for the held modifier). It opens after 180 ms. Move, then release. A quick flick works too: every direction stays live past the rim.':'Move over the menu: categories preview their choices outward. Move out to pick, click to apply. Keys: 1–8, arrows, Return, Esc.';if(v==='hold'){clearTimeout(close.t)}});
seg('themeSeg',v=>{menu.classList.remove('dark','light');menu.classList.add(v);grid.className=grid.className});
seg('motionSeg',v=>{stage.classList.toggle('reduce',v==='reduce')});
status();show(stage.clientWidth/2,stage.clientHeight/2);{const [x,y]=pt(52,186);hit(x,y);}
window.__demo=(x,y)=>{const sr=stage.getBoundingClientRect();hit((x-cx)/scale,(y-cy)/scale)};
</script>
