<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pointer On/Off</title>
<style>
  body { margin: 0; padding: 12px; color: #d8d8d8; background: #2d2d2d; font: 12px/1.5 -apple-system, sans-serif; }
  h1 { margin: 0 0 8px; font-size: 13px; font-weight: 600; }
  p { margin: 0 0 8px; }
</style>
</head>
<body>
  <h1>Current pointer</h1>
  <p>Turn the pointer selected in Look Here Please on or off. Your selection stays the same.</p>
  <p>The key shows the selected hand or laser and its On/Off state. Choose a different pointer in the app.</p>
  <p>Keep Look Here Please running to use this key.</p>
<script>
// Register the read-only inspector without reading or writing saved key settings.
function connectElgatoStreamDeckSocket(port, uuid, registerEvent) {
  const connection = new WebSocket('ws://127.0.0.1:' + port);
  connection.onopen = () => connection.send(JSON.stringify({ event: registerEvent, uuid }));
}
</script>
</body>
